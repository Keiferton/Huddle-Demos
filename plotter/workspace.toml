# Drawing area for the pen, separate from the printer travel/homing limits.
# Local drawing coordinates: X 0..100, Y 0..100 mm.
# Machine coordinates = origin + local drawing coordinates.
# Centered on the nominal 220 x 220 mm bed, with estimated pen offset:
# X=-26.25 mm (nozzle assumed centered on 63.5 mm E plate), Y=0 mm.
# Verify alignment with the mounted pen before drawing.
# The manual center command loads this file; jogs use printer travel limits.
[workspace]
width = 100.0
height = 100.0
origin_x = 86.25
origin_y = 60.0

# User calibrated with the mounted pen: contact at Z=0, clear at Z=2 mm.
[pen]
down_z = 0.0
up_z = 2.0
