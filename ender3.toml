# This workshop printer only: physical Z stop must stay in its measured position.
# X/Y maxima are user-reported nominal bounds; verify before approaching their ends.
[printer]
port = "/dev/ttyUSB0"
baud = 115200
timeout = 5.0
startup_wait = 2.0
motion_timeout = 120.0
# Firmware reported X=-3 after homing; home is outside the nominal bed area.
x_min = -3.0
x_max = 220.0
# Firmware reported Y=-10 after homing.
y_min = -10.0
y_max = 220.0
z_min = 0.0
z_max = 200.0
# Feed rates in mm/min: XY 50 mm/s, Z 5 mm/s.
xy_feed = 3000.0
z_feed = 300.0
max_jog = 5.0
