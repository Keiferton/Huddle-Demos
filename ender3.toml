# This workshop printer only: physical Z stop must stay in its measured position.
# X/Y are user-reported nominal bounds; verify before approaching their ends.
[printer]
port = "/dev/ttyUSB0"
baud = 115200
timeout = 5.0
startup_wait = 2.0
motion_timeout = 120.0
x_min = 0.0
x_max = 220.0
y_min = 0.0
y_max = 220.0
z_min = 0.0
z_max = 200.0
# Feed rates in mm/min: XY 5 mm/s, Z 1 mm/s.
xy_feed = 300.0
z_feed = 60.0
max_jog = 5.0
